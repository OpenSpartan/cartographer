[package]
name = "cartographer"
# Not a release: CI sets the version from the release tag (build.rs), so a build from source says 0.0.0-dev.
version = "0.0.0"
edition = "2021"
description = "OpenSpartan Cartographer: a live map of Halo Infinite LAN matches (build 269225.26.04.08.1618)"
publish = false

[dependencies]
filmshell = { path = "../../../libfilmshell", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny_http = "0.12"
open = "5"
console = "0.16"
# films-ui's TypeScript as JavaScript, without Node (typescript.rs): the dev server converts it.
oxc = { version = "0.158", default-features = false, features = ["transformer", "codegen", "semantic"] }
png = "0.17"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[build-dependencies]
# build.rs converts films-ui's TypeScript to embed it (typescript.rs).
oxc = { version = "0.158", default-features = false, features = ["transformer", "codegen", "semantic"] }
# And makes each plan's limits from film-assets' access files (limits.rs).
serde_json = "1"

# The exe's version resource and icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
